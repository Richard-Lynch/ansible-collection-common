---
DOCUMENTATION:
  name: onepassword_refs
  author: Richard Lynch (@Richard-Lynch)
  version_added: "1.0.0"
  short_description: List the 1Password items a YAML text reads through onepassword_cached
  description:
    - Finds every C(onepassword_cached) lookup call in a text (under any collection prefix, or the
      bare name) and returns one entry per distinct read.
    - Built for a preflight that probes every credential a run will read before the run changes
      anything, read from the same files the run reads so the list cannot drift from them.
    - A lookup quoted in a YAML comment is not a read and is skipped.
  options:
    _input:
      description: The text of a YAML file (for example from C(lookup('file', ...))).
      type: str
      required: true

EXAMPLES: |
  - name: List the items a host_vars file reads
    ansible.builtin.debug:
      msg: "{{ lookup('ansible.builtin.file', 'host_vars/app.yml') | richard_lynch.common.onepassword_refs }}"

RETURN:
  _value:
    description:
      - One dictionary per distinct read, in order of first appearance.
      - C(item) is the literal item title, or null when the title is a variable.
      - C(item_var) is that variable's name when the title is not a literal.
      - C(field) is the C(field=) argument, C(password) when absent.
      - C(optional) is true when the lookup passes C(missing='empty').
      - C(guard) is the variable an C(if <guard> ... else '') expression is conditional on, or null.
    type: list
    elements: dict
