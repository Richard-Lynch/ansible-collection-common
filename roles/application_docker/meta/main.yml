    keeps dockerd on its local socket unless TCP is explicitly enabled.
  license: GPL-3.0-or-later
  min_ansible_version: "2.19"
  platforms:
    - name: Debian
      versions: [bookworm]
    - name: Ubuntu
      versions: [noble]
  galaxy_tags: [docker, containers, systemd]
dependencies: []
