# Converge tier against two INVENTORY hosts that both resolve to this controller over the local
# connection: one with an address (the role must find it and connect), one without (the role's
# HARD GATE must fail after its refreshes instead of falling through green).
---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: localhost
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
    # Dependencies (galaxy.yml) are installed into collections.galaxy/ at the repo root; the
    # second entry resolves this collection itself when the checkout sits at
    # ansible_collections/richard_lynch/common. molecule does not read a repo ansible.cfg.
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections.galaxy:${MOLECULE_PROJECT_DIRECTORY}/../../../../.."
  inventory:
    hosts:
      all:
        hosts:
          uvc_target:
            ansible_host: 127.0.0.1
            ansible_connection: local
          uvc_noaddr:
            ansible_connection: local
    host_vars:
      localhost:
        ansible_connection: local
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
